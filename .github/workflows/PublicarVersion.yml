name: Publicar versión

on:
  push:
    branches:
      - master
    paths:
      - public/version.json
      - public/index.html
      - .github/workflows/PublicarVersion.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Validar version.json
        run: node Scripts/ValidarVersionPublicacion.js
      - name: Preparar publicación
        run: |
          mkdir PublicacionPages
          cp public/version.json PublicacionPages/version.json
          cp public/index.html PublicacionPages/index.html
      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v4
        with:
          path: PublicacionPages
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: preparar
    steps:
      - name: Publicar en GitHub Pages
        id: publicacion
        uses: actions/deploy-pages@v4
